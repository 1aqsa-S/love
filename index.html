<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hi! My Wifeyyy</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Dancing+Script:wght=700&family=Playfair+Display:ital,wght=1,500&family=Poppins:wght=300;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%); height: 100vh; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; font-family: 'Poppins', sans-serif; }
        
        .heart-bg { position: absolute; font-size: 2.5rem; animation: floatAndSway 7s linear infinite; bottom: -60px; opacity: 0.6; user-select: none; }
        @keyframes floatAndSway { 
            0% { transform: translateY(0) translateX(0) scale(0.8) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            50% { transform: translateY(-50vh) translateX(25px) scale(1.1) rotate(15deg); }
            100% { transform: translateY(-105vh) translateX(-10px) scale(1.3) rotate(-15deg); opacity: 0; } 
        }

        .container { text-align: center; color: white; z-index: 10; padding: 20px; max-width: 700px; }
        .main-heart { font-size: 5.5rem; animation: pulse 1.4s infinite; margin-bottom: 10px; display: inline-block; filter: drop-shadow(0 4px 10px rgba(0,0,0,0.15)); }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.08); } 100% { transform: scale(1); } }
        
        /* Updated custom requested titles */
        h1 { font-family: 'Dancing Script', cursive; font-size: 4.2rem; margin-bottom: 5px; text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.2); }
        .sub-proceed { font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 1.8rem; margin-bottom: 25px; text-shadow: 1px 2px 4px rgba(0,0,0,0.15); letter-spacing: 0.5px; }
        p { font-family: 'Playfair Display', serif; font-style: italic; font-size: 1.2rem; line-height: 1.6; margin-bottom: 45px; font-weight: 500; opacity: 0.95; }
        
        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { background: white; color: #ff4b5c; padding: 14px 28px; border: none; border-radius: 30px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-shadow: 0 6px 20px rgba(0,0,0,0.1); text-decoration: none; position: relative; }
        .btn:hover { transform: translateY(-4px); background: #ff4b5c; color: white; box-shadow: 0 8px 25px rgba(255, 75, 92, 0.4); }

        .confetti { position: absolute; width: 10px; height: 10px; transform: scale(0); border-radius: 50%; animation: popOut 0.8s ease-out forwards; pointer-events: none; z-index: 99; }
        @keyframes popOut {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) scale(0.5); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="heart-bg" style="left: 5%; animation-delay: 0s; font-size: 3rem;">❤️</div>
    <div class="heart-bg" style="left: 15%; animation-delay: 3s;">💖</div>
    <div class="heart-bg" style="left: 28%; animation-delay: 1s; font-size: 2rem;">💕</div>
    <div class="heart-bg" style="left: 42%; animation-delay: 5s;">🌹</div>
    <div class="heart-bg" style="left: 55%; animation-delay: 0.5s; font-size: 3.5rem;">❤️</div>
    <div class="heart-bg" style="left: 68%; animation-delay: 2.5s;">👩‍❤️‍👨</div>
    <div class="heart-bg" style="left: 82%; animation-delay: 4s; font-size: 2.2rem;">✨</div>
    <div class="heart-bg" style="left: 93%; animation-delay: 1.5s;">💘</div>

    <div class="container">
        <div class="main-heart">💝</div>
        <h1>HI!.. MY WIFEYyy..🫣🎀💝✨</h1>
        <div class="sub-proceed">Smile to Proceed</div>
        <p>"In all the world, there is no heart for me like yours."</p>
        
        <div class="btn-group">
            <a href="story.html" class="btn" onclick="burstConfetti(event, 'story.html')">Our Story</a>
            <a href="gallery.html" class="btn" onclick="burstConfetti(event, 'gallery.html')">Gallery</a>
            <a href="messages.html" class="btn" onclick="burstConfetti(event, 'messages.html')">Messages</a>
        </div>
    </div>

    <script>
        function burstConfetti(event, targetUrl) {
            event.preventDefault(); 
            const colors = ['#ffffff', '#ff4b5c', '#fecfef', '#ffccd5', '#fff0f2'];
            
            for (let i = 0; i < 30; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.left = event.clientX + 'px';
                confetti.style.top = event.clientY + 'px';
                
                const x = (Math.random() - 0.5) * 200;
                const y = (Math.random() - 0.5) * 200;
                confetti.style.setProperty('--x', `${x}px`);
                confetti.style.setProperty('--y', `${y}px`);
                
                document.body.appendChild(confetti);
                setTimeout(() => confetti.remove(), 800);
            }

            setTimeout(() => {
                window.location.href = targetUrl;
            }, 500);
        }
    </script>
</body>
</html>
