<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Gallery - Spiral Album</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Dancing+Script:wght=700&family=Poppins:wght=300;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }

        body {
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: white;
            perspective: 1200px;
            -webkit-perspective: 1200px;
        }

        h1 { font-family: 'Dancing Script', cursive; font-size: 4rem; margin-top: 20px; text-shadow: 2px 3px 6px rgba(0, 0, 0, 0.2); }
        .subtitle { font-size: 1.1rem; opacity: 0.9; margin-bottom: 60px; }

        /* FIXED: Hardware accelerated outer stage matrix container wrapper */
        .stage {
            width: 280px;
            height: 360px;
            position: relative;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            will-change: transform; /* Smooths rendering jumps */
        }

        /* FIXED: Force anti-flicker on individual card wrappers */
        .photo-card {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: white;
            padding: 15px;
            padding-bottom: 35px;
            border-radius: 12px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            transform-style: preserve-3d;
            -webkit-transform-style: preserve-3d;
            will-change: transform;
            -webkit-font-smoothing: antialiased;
        }

        /* FIXED: Smoothed inner image rendering layer framework */
        .photo-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 6px;
            background-color: #eee;
            transform: translateZ(1px); /* Forces discrete graphics layered mode rendering */
        }

        .caption {
            color: #4a0e17;
            font-family: 'Dancing Script', cursive;
            font-size: 1.6rem;
            margin-top: 12px;
            text-align: center;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin: 60px 0 40px 0;
            z-index: 100;
        }

        .nav-btn {
            background: white;
            color: #ff4b5c;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            transition: all 0.2s ease;
        }

        .nav-btn:hover {
            transform: scale(1.05);
            background: #4a0e17;
            color: white;
        }

        .back-btn {
            display: inline-block;
            background: rgba(255,255,255,0.2);
            color: white;
            border: 2px solid white;
            padding: 10px 30px;
            border-radius: 25px;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.3s ease;
            z-index: 100;
            margin-bottom: 20px;
        }

        .back-btn:hover { background: white; color: #ff4b5c; }
    </style>
</head>
<body>

    <h1>Our Gallery</h1>
    <p class="subtitle">Spin through our 5 magical memories together ✨</p>

    <div class="stage" id="spiralStage">
        <!-- Photo Frame 1 -->
        <div class="photo-card">
            <img src="photo1.png" onerror="this.onerror=null; this.src='photo1.png.png'; this.addEventListener('error', function(){this.src='photo1.jpg'});" alt="Photo 1 Frame">
            <p class="caption">The beautiful start ✨</p>
        </div>
        <!-- Photo Frame 2 -->
        <div class="photo-card">
            <img src="photo2.png" onerror="this.onerror=null; this.src='photo2.png.png'; this.addEventListener('error', function(){this.src='photo2.jpg'});" alt="Photo 2 Frame">
            <p class="caption">Laughs shared 🌅</p>
        </div>
        <!-- Photo Frame 3 -->
        <div class="photo-card">
            <img src="photo3.png" onerror="this.onerror=null; this.src='photo3.png.png'; this.addEventListener('error', function(){this.src='photo3.jpg'});" alt="Photo 3 Frame">
            <p class="caption">Endless talks 💕</p>
        </div>
        <!-- Photo Frame 4 -->
        <div class="photo-card">
            <img src="photo4.png" onerror="this.onerror=null; this.src='photo4.png.png'; this.addEventListener('error', function(){this.src='photo4.jpg'});" alt="Photo 4 Frame">
            <p class="caption">My prettiest princess 👑</p>
        </div>
        <!-- Photo Frame 5 -->
        <div class="photo-card">
            <img src="photo5.png" onerror="this.onerror=null; this.src='photo5.png.png'; this.addEventListener('error', function(){this.src='photo5.jpg'});" alt="Photo 5 Frame">
            <p class="caption">Captured moments 📸</p>
        </div>
    </div>

    <div class="controls">
        <button class="nav-btn" onclick="rotateAlbum(-1)">← Previous</button>
        <button class="nav-btn" onclick="rotateAlbum(1)">Next →</button>
    </div>

    <a href="index.html" class="back-btn">← Back Home</a>

    <script>
        const stage = document.getElementById('spiralStage');
        const cards = document.querySelectorAll('.photo-card');
        const totalCards = cards.length;
        let currentIndex = 0;

        const angleIncrement = 360 / totalCards;
        const radius = 280; 

        function layoutAlbum() {
            cards.forEach((card, i) => {
                const angle = i * angleIncrement;
                // FIXED: Explicitly applied 3D translations to enforce GPU rendering profiles
                card.style.transform = `rotateY(${angle}deg) translateZ(${radius}px)`;
                card.style.webkitTransform = `rotateY(${angle}deg) translateZ(${radius}px)`;
            });
        }

        function rotateAlbum(direction) {
            currentIndex += direction;
            const currentRotation = -currentIndex * angleIncrement;
            stage.style.transform = `rotateY(${currentRotation}deg)`;
            stage.style.webkitTransform = `rotateY(${currentRotation}deg)`;
        }

        layoutAlbum();
    </script>
</body>
</html>
